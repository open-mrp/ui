version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      groups:
          # One PR per week for the routine bumps; majors still arrive individually.
          minor-and-patch:
              update-types: ['minor', 'patch']

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      ignore:
          # changesets/action v2 requires @changesets/cli v3; bump both together.
          - dependency-name: 'changesets/action'
            update-types: ['version-update:semver-major']
      groups:
          actions:
              patterns: ['*']
